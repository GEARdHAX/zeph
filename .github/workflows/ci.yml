name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secret Scanning ──────────────────────────────────────────
  # Runs first and blocks everything downstream if secrets are detected.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for gitleaks --log-opts

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only needed for private repos on gitleaks.io
        # Exit code 1 = secrets found → workflow fails hard

  # ── Backend ──────────────────────────────────────────────────
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    needs: secret-scan

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests
        run: npm test
        env:
          # mongodb-memory-server spins up its own in-process Mongo instance per test run,
          # so no live DB service is needed here.
          NODE_ENV: test
          AUTH_SECRET: ci-test-secret
          PORT: 4002

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    needs: secret-scan

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint:check

      - name: Run tests
        run: npm test --if-present
        env:
          CI: true
          VITE_BACKEND_URL: http://localhost:4002

  # ── Docker Build Smoke Test ──────────────────────────────────
  # Confirms both Dockerfiles build without error.
  # Does NOT push to a registry (that's Phase 8's job).
  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: chattr-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: chattr-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
